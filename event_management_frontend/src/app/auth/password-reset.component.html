<form class="auth-form" (ngSubmit)="onSubmit()" autocomplete="on">
  <h2>Set New Password</h2>
  <label for="newPassword">New Password</label>
  <input id="newPassword" type="password" required minlength="6" [(ngModel)]="newPassword" name="newPassword" [disabled]="loading" autofocus />
  <label for="confirmPassword">Confirm Password</label>
  <input id="confirmPassword" type="password" required minlength="6" [(ngModel)]="confirmPassword" name="confirmPassword" [disabled]="loading" />
  <button type="submit" [disabled]="loading">{{ loading ? 'Setting...' : 'Set Password' }}</button>
  <div *ngIf="error" style="color:#ad0101; margin-bottom:.7em; font-weight: 600;">{{ error }}</div>
  <div *ngIf="success" style="color:green; margin-bottom:.7em; font-weight: 600;">{{ success }}</div>
  <div style="margin-top:1.5rem;text-align:center;font-size:0.95em;">
    <a routerLink="/auth/login" style="color:#ad0101; font-weight: 600;">Back to Login</a>
  </div>
</form>
